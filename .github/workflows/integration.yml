name: Integration Test

on:
  push:
    branches: [main, update-internal]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: sqd-clickhouse
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --health-cmd "clickhouse-client --password sqd-clickhouse -q 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -o tmp/sqd-go .

      - name: Unit tests
        run: go test $(go list ./... | grep -v 'examples/polymarket' | grep -v 'internal/coldcache') -count=1 -timeout 60s

      - name: Integration test (15s indexing)
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_NATIVE_PORT: "9000"
          CLICKHOUSE_HTTP_PORT: "8123"
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: sqd-clickhouse
        run: |
          go test -v -run TestIntegrationIndexSmallRange -count=1 -timeout 30s ./internal/ingestion/
