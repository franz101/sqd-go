name: Integration Test

on:
  push:
    branches: [main, staging, update-internal]
  pull_request:
    branches: [main]

# Two jobs run in parallel so total wall-clock is the slower of the two, not the
# sum. Both reuse the Go build/module cache (actions/setup-go cache: true), so a
# warm run skips the ~30s cold compile of go-ethereum/pebble/clickhouse.
jobs:
  build-test:
    name: Build, unit tests, scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: go build -o tmp/sqd-go .

      # The uniswap example's generated/ package is git-ignored and produced by
      # codegen, not committed. examples/uniswap (and its _test files) import it,
      # so it must exist on disk before `go list ./...` / `go test` load that
      # package — otherwise the build fails. codegen is offline (parses config +
      # templates), so this runs without network or ClickHouse.
      - name: Codegen uniswap example
        run: |
          ./tmp/sqd-go codegen examples/uniswap
          test -f examples/uniswap/generated/events.go || (echo "events.go not generated" && exit 1)
          test -f examples/uniswap/generated/parser.go || (echo "parser.go not generated" && exit 1)
          echo "codegen uniswap: OK"

      # Exclude examples/polymarket (heavy benches, git-ignored) and the top-level
      # coldcache package (grep matches the path segment, not "internal/coldcache"
      # which never existed). Live-portal tests self-skip unless SQD_LIVE_PORTAL=1.
      - name: Unit tests
        run: go test $(go list ./... | grep -v 'examples/polymarket' | grep -v '/coldcache') -count=1 -timeout 180s

      - name: Init from ABI (contract-import)
        run: |
          ./tmp/sqd-go init contract-import local \
            --abi examples/erc20.json \
            --name USDC \
            --blockchain ethereum \
            --start-block 6082465 \
            --address 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48
          test -f usdc/config.yaml || (echo "config.yaml not created" && exit 1)
          test -f usdc/.env || (echo ".env not created" && exit 1)
          test -f usdc/compose.yml || (echo "compose.yml not created" && exit 1)
          echo "init contract-import: OK"

      - name: Codegen from init project
        run: |
          ./tmp/sqd-go codegen usdc/
          test -f usdc/generated/events.go || (echo "events.go not generated" && exit 1)
          test -f usdc/generated/schema.go || (echo "schema.go not generated" && exit 1)
          echo "codegen: OK"

  integration:
    name: ClickHouse integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      clickhouse:
        # Pinned tag (not :latest) so a ClickHouse release can't silently change
        # startup time or behavior and break this job.
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: sqd-clickhouse
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --health-cmd "clickhouse-client --password sqd-clickhouse -q 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      - name: Integration test (live-portal indexing)
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_NATIVE_PORT: "9000"
          CLICKHOUSE_HTTP_PORT: "8123"
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: sqd-clickhouse
        # 120s go-test timeout comfortably covers the test's 45s indexing budget
        # plus ClickHouse setup/verify, with headroom for a slow portal fetch.
        run: |
          go test -v -run TestIntegrationIndexSmallRange -count=1 -timeout 120s ./internal/ingestion/
