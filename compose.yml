name: sqd-go

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-sqd-clickhouse}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123" # HTTP interface (defaults to 8123)
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000" # Native client interface (defaults to 9000)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/users.d/grafana.xml:/etc/clickhouse-server/users.d/grafana.xml:ro
      - ./clickhouse/config.d/log-retention.xml:/etc/clickhouse-server/config.d/log-retention.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - clickhouse
    environment:
      # Auto-install the official ClickHouse data source plugin on first boot.
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_DEFAULT_THEME: "dark"
      # Consumed by the provisioned data source (grafana/provisioning/datasources).
      # clickhouse:9000 is the native port on the compose network (no TLS).
      CH_HOST: "clickhouse"
      CH_PORT: "9000"
      CH_USER: "${GRAFANA_CH_USER:-grafana}"
      CH_PASSWORD: "${GRAFANA_CH_PASSWORD:-grafana_ro}"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  clickhouse_data:
  grafana_data:
