root = "."
tmp_dir = "tmp"

[build]
cmd = "make dev-build"
entrypoint = ["./tmp/main"]
include_ext = ["go", "json", "toml", "yaml", "yml"]
exclude_dir = ["generated", "tmp", "vendor", ".git"]
exclude_regex = ["_test.go"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = false

[screen]
clear_on_rebuild = false
keep_scroll = true
